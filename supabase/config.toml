# Supabase local dev config. Run `supabase init` once linked if the CLI
# wants to regenerate this with a project_id; this file is a starting point.

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = false          # mailboxes are admin-provisioned, not self-signup

[storage]
enabled = true
file_size_limit = "25MiB"      # headroom above typical email attachment limits

[edge_runtime]
enabled = true

# inbound-email is called by Resend's servers, not the browser, so it
# never carries a Supabase-issued JWT - it authenticates the request itself
# via Svix signature verification (see verifySvixSignature.ts). Without
# this, Supabase's own gateway rejects every webhook call with 401
# UNAUTHORIZED_NO_AUTH_HEADER before the function's code ever runs.
[functions.inbound-email]
verify_jwt = false
